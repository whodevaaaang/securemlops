services:
  ml-api:
    build:
      context: ./ml-app
    image: securemlops/ml-api:local
    container_name: securemlops-api
    ports:
      - "8000:8000"
    environment:
      API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

name: SecureMLOps CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: securemlops/ml-api
  WORKDIR: ml-app

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.WORKDIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 api model --max-line-length=120 --extend-ignore=E203,W503

      - name: Format check (black)
        run: black --check --line-length=120 api model

      - name: Train model artifact
        run: python -m model.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: ml-app/model/artifacts/model.joblib
          retention-days: 7

  test:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.WORKDIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-artifact
          path: ml-app/model/artifacts

      - name: Run unit tests with coverage
        run: pytest --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ml-app/coverage.xml
          retention-days: 7

      - name: Bandit (Python SAST)
        run: bandit -r api model -ll -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: ml-app/bandit-report.json
          retention-days: 7

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: ./ml-app
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.tag }}
          path: image.tar.gz
          retention-days: 3

  deploy:
    name: Deploy (container)
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.run.outputs.endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker.outputs.image-tag }}

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Run container with secret-injected token
        id: run
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          docker run -d --name securemlops-api \
            -p 8000:8000 \
            -e API_TOKEN="$API_TOKEN" \
            ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.image-tag }}
          echo "endpoint=http://localhost:8000" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployment
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: bash scripts/smoke-test.sh http://localhost:8000

      - name: Capture logs on failure
        if: failure()
        run: docker logs securemlops-api || true

      - name: Stop container
        if: always()
        run: docker rm -f securemlops-api || true
